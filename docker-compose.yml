volumes:
  pg_data:


services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: org_structure/Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    working_dir: /app/org_structure
    command: >
      sh -c "python manage.py migrate &&
            (
              python manage.py shell -c 'import sys; from department.models import Department; sys.exit(0 if Department.objects.exists() else 1)' ||
              python manage.py loaddata department/fixtures/demo_data.json
            ) &&
            python manage.py runserver 0.0.0.0:8000"
