volumes:
  pg_data:


services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: org_structure/Dockerfile
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    command: >
      sh -c "cd org_structure &&
            python manage.py migrate &&
            python manage.py runserver 0.0.0.0:8000"
